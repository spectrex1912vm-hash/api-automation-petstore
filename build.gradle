plugins {
    id 'java'

}

sourceSets {
    test {
        resources {
            srcDir 'src/test/resources'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.2.3",
            "org.junit.jupiter:junit-jupiter:5.10.2",
            "io.qameta.allure:allure-junit5:2.27.0",
            "io.qameta.allure:allure-selenide:2.27.0",
            "org.aspectj:aspectjweaver:1.9.24",
            "io.rest-assured:rest-assured:5.5.6",
            "com.fasterxml.jackson.core:jackson-databind:2.21.2",
            "org.assertj:assertj-core:3.27.7",
            "org.projectlombok:lombok:1.18.46",
            "io.qameta.allure:allure-rest-assured:2.27.0"
    )
    compileOnly "org.projectlombok:lombok:1.18.46"
    annotationProcessor "org.projectlombok:lombok:1.18.46"

    testCompileOnly "org.projectlombok:lombok:1.18.46"
    testAnnotationProcessor "org.projectlombok:lombok:1.18.46"
}

test {
    useJUnitPlatform()

    jvmArgs "-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('aspectjweaver') }}"
}